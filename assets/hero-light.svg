<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" width="1200" height="460" role="img" aria-label="Cleber França, dev full-stack e designer, disponível para oportunidades. Ilustração 3D animada com três camadas: design, interface e código."><style>.hlly{animation:hlfl 1.1s cubic-bezier(.2,.9,.25,1) both}.hltx{animation:hlsl .9s cubic-bezier(.2,.8,.2,1) both}.hlsp{opacity:0;animation:hltw 1.6s ease-in-out both}.hldot{transform-box:fill-box;transform-origin:center;animation:hlpu 1.2s ease-in-out 1s 3}@keyframes hlfl{from{opacity:0;transform:translateY(70px)}to{opacity:1;transform:none}}@keyframes hlsl{from{opacity:0;transform:translateX(-14px)}to{opacity:1;transform:none}}@keyframes hltw{0%{opacity:0;transform:translateY(0)}40%{opacity:1}100%{opacity:0;transform:translateY(-40px)}}@keyframes hlpu{50%{transform:scale(1.6);opacity:.5}}@media (prefers-reduced-motion: reduce){.hlly,.hltx,.hldot{animation:none !important}.hlsp{display:none}}</style><defs><radialGradient id="hlgl" cx="0.72" cy="0.5" r="0.55"><stop offset="0" stop-color="#ff3366" stop-opacity="0.18"></stop><stop offset="1" stop-color="#ff3366" stop-opacity="0"></stop></radialGradient><linearGradient id="hlbg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff"></stop><stop offset="1" stop-color="#fff3f6"></stop></linearGradient><pattern id="hldt" width="20" height="20" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#ecd5dc"></circle></pattern><filter id="hlgr" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" stitchTiles="stitch"></feTurbulence><feColorMatrix type="matrix" values="0 0 0 0 0.5  0 0 0 0 0.5  0 0 0 0 0.5  0 0 0 0.06 0"></feColorMatrix></filter><filter id="hlbl" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="10"></feGaussianBlur></filter><linearGradient id="hlnm" x1="0" x2="1"><stop offset="0" stop-color="#1f1320"></stop><stop offset="1" stop-color="#c2183f"></stop><